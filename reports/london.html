range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"22a60624-cf18-49d6-83ef-e7025a857311\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"402dc6be-e05b-4be3-88e9-414d75aaa828\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4656837a-334a-4332-924e-a16715fbf621\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"22a60624-cf18-49d6-83ef-e7025a857311\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --color-bg: #182456;\n    --color-surface: #1f2c66;\n    --color-text: #F3EEE4;\n    --color-accent: #E8C84A;\n    --color-accent-2: #E8C84A;\n    --color-divider: rgba(243,238,228,0.38);\n    --color-neutral-100: #2a3878;\n    --color-neutral-200: #22306b;\n    --color-neutral-300: rgba(243,238,228,0.22);\n    --color-neutral-400: #5f6ca4;\n    --color-neutral-500: #8b95bd;\n    --color-neutral-600: #a7afd0;\n    --color-neutral-700: #c2c7de;\n    --color-neutral-800: #e4dfd4;\n    --color-neutral-900: #F3EEE4;\n    --color-accent-100: rgba(232,200,74,0.14);\n    --color-accent-600: #f2d65f;\n    --color-accent-700: #E8C84A;\n    --font-heading: \"Cormorant Garamond\", Georgia, serif;\n    --font-heading-weight: 600;\n    --font-body: \"Jost\", system-ui, sans-serif;\n  }\n  body { margin: 0; background: var(--color-bg); color: var(--color-text); }\n  a { color: var(--color-accent); text-decoration: none; border-bottom: 1px solid var(--color-accent); }\n  a:hover { color: var(--color-bg); background: var(--color-accent); }\n  em { font-style: italic; }\n  ::selection { background: rgba(232,200,74,0.35); }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n<div style=\"background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); min-height: 100vh;\">\n\n  <div style=\"background: var(--color-bg); border-bottom: 2px solid var(--color-divider); display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 24px; padding: 14px clamp(20px, 5vw, 40px);\">\n    <div style=\"display: flex; align-items: center; gap: 12px;\">\n      <img src=\"a7f835ad-7f81-4705-b8e8-94235ace532c\" alt=\"Humans in Conversation\" style=\"width: 34px; height: 34px; display: block; flex: none;\">\n      <span style=\"font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-accent);\">Humans in Conversation<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700);\">S4E Analysis · London · Table Nine<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 1240px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 40px);\">\n\n    <header style=\"padding: clamp(48px, 9vw, 88px) 0 0;\">\n      <div style=\"display: flex; align-items: center; gap: 16px; margin-bottom: 34px;\">\n        <span style=\"display: block; width: 46px; height: 1px; background: var(--color-accent);\"><\u002Fspan>\n        <span style=\"font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-accent);\">Field report / London / 15 June<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-size: clamp(40px, 8.5vw, 88px); font-weight: 500; line-height: 1.03; letter-spacing: -0.005em; max-width: 14ch; margin: 0 0 clamp(24px, 4vw, 36px); text-wrap: pretty;\">This city doesn't stop. But how are you <em style=\"font-weight: 500; color: var(--color-accent);\">really doing<\u002Fem> inside it?<\u002Fh1>\n      <p style=\"font-size: clamp(17px, 2.4vw, 21px); line-height: 1.45; max-width: 58ch; margin: 0 0 clamp(32px, 5vw, 48px); color: var(--color-neutral-800);\">Nine Londoners sat down with strangers one evening in June and answered honestly. This is what they said, and what we heard in it.<\u002Fp>\n    <\u002Fheader>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 1px; background: var(--color-neutral-300); border-top: 2px solid var(--color-divider); border-bottom: 2px solid var(--color-divider);\">\n      <div style=\"background: var(--color-bg); padding: 18px 16px 18px 0;\">\n        <div style=\"font-size: clamp(28px, 4vw, 34px); font-family: var(--font-heading); font-weight: 600; line-height: 1;\">61<\u002Fdiv>\n        <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-700); margin-top: 6px;\">Moments<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-bg); padding: 18px 16px;\">\n        <div style=\"font-size: clamp(28px, 4vw, 34px); font-family: var(--font-heading); font-weight: 600; line-height: 1;\">7<\u002Fdiv>\n        <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-700); margin-top: 6px;\">Parts of the evening<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-bg); padding: 18px 16px;\">\n        <div style=\"font-size: clamp(28px, 4vw, 34px); font-family: var(--font-heading); font-weight: 600; line-height: 1;\">9<\u002Fdiv>\n        <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-700); margin-top: 6px;\">Storytellers<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-bg); padding: 18px 16px;\">\n        <div style=\"font-size: clamp(28px, 4vw, 34px); font-family: var(--font-heading); font-weight: 600; line-height: 1;\">01<\u002Fdiv>\n        <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-700); margin-top: 6px;\">Version<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: var(--color-bg); padding: 18px 16px;\">\n        <div style=\"font-size: clamp(28px, 4vw, 34px); font-family: var(--font-heading); font-weight: 600; line-height: 1;\">0<\u002Fdiv>\n        <div style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-700); margin-top: 6px;\">Cameras. Ever.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <section style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(36px, 5vw, 64px); padding: clamp(44px, 7vw, 72px) 0;\">\n      <div>\n        <h6 style=\"color: var(--color-neutral-700); margin-bottom: 20px;\">Why we sit at these tables<\u002Fh6>\n        <p style=\"font-size: clamp(16px, 1.9vw, 17px); line-height: 1.6; margin-bottom: 18px;\">Since October 2025, HuCon has been going city to city asking one question: how are you really doing?<\u002Fp>\n        <p style=\"font-size: clamp(16px, 1.9vw, 17px); line-height: 1.6; margin-bottom: 18px;\">Strangers sit down together, share food, and answer honestly. Every table is recorded with consent, anonymised and archived. You can listen to this one <a href=\"https://open.spotify.com/show/2ILbCJPVYC5YXUJunZSBy6\" target=\"_blank\" rel=\"noopener\">on Spotify<\u002Fa>.<\u002Fp>\n        <p style=\"font-size: clamp(16px, 1.9vw, 17px); line-height: 1.6; margin-bottom: 18px;\">Two things happen. People connect with the ones they think of as other. And they say things a survey would never catch.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-left: 2px solid var(--color-divider); padding-left: clamp(18px, 3vw, 40px); display: flex; flex-direction: column; justify-content: center;\">\n        <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-accent-700); margin-bottom: 18px;\">What a survey would have recorded<\u002Fdiv>\n        <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(27px, 4.6vw, 40px); line-height: 1.1; letter-spacing: -0.005em; margin-bottom: 20px; text-wrap: pretty;\">“I would say the word <span style=\"color: var(--color-accent);\">‘fine’<\u002Fspan>… I'm completely dissociated from myself, and I'm very performative.”<\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--color-neutral-700);\">A public health worker, asked how she was doing<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <hr class=\"hr\" style=\"margin: 0;\">\n\n    <section style=\"padding: clamp(44px, 7vw, 72px) 0 0;\">\n      <h6 style=\"color: var(--color-neutral-700); margin-bottom: 24px;\">How we read it<\u002Fh6>\n      <h2 style=\"font-size: clamp(30px, 5.4vw, 46px); letter-spacing: -0.005em; text-wrap: pretty; max-width: 22ch; margin-bottom: 24px;\">Four things shape how anyone is doing.<\u002Fh2>\n      <p style=\"font-size: clamp(16px, 1.9vw, 17px); line-height: 1.6; max-width: 62ch; margin-bottom: 48px;\">We listened to the recording and marked what each person was really talking about. Almost everything fell into one of four.<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); border-top: 2px solid var(--color-divider);\">\n        <sc-for list=\"{{ framework }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div style=\"padding: 26px clamp(22px, 3vw, 36px) 30px 0; margin-right: clamp(22px, 3vw, 36px); border-right: 1px solid var(--color-neutral-300); display: flex; flex-direction: column; gap: 12px; min-width: 0;\">\n            <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: 30px; letter-spacing: 0; line-height: 1;\">{{ f.name }}<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.55; color: var(--color-neutral-800);\">{{ f.def }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 48px; border-top: 2px solid var(--color-divider); margin-top: 0; padding-top: 32px;\">\n        <div>\n          <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: 24px; margin-bottom: 10px;\">And what sits underneath<\u002Fdiv>\n          <p style=\"font-size: 16px; line-height: 1.6; color: var(--color-neutral-800);\">Money, class, migration, politics, age, race, history, religion, culture, tech. Usually unnamed in the room, but shaping what gets said.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: 24px; margin-bottom: 10px;\">What we listen for<\u002Fdiv>\n          <p style=\"font-size: 16px; line-height: 1.6; color: var(--color-neutral-800);\">Empathy: whether people reach across a divide or not. Where it is missing is where the next work sits.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: clamp(52px, 8vw, 88px) 0 0;\">\n      <hr class=\"hr\" style=\"margin: 0 0 40px;\">\n      <h6 style=\"color: var(--color-neutral-700); margin-bottom: 24px;\">What we found<\u002Fh6>\n      <h2 style=\"font-size: clamp(30px, 5.4vw, 46px); letter-spacing: -0.005em; text-wrap: pretty; max-width: 24ch; margin-bottom: 16px;\">One evening, sixty-one moments.<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.6; max-width: 60ch; color: var(--color-neutral-800); margin-bottom: 56px;\">Click anything below to jump to the moments behind it.<\u002Fp>\n\n      <div style=\"border-top: 2px solid var(--color-divider); padding-top: 20px; margin-bottom: 72px;\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 28px;\">\n          <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(23px, 3.6vw, 28px);\">Where empathy showed up<\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--color-neutral-700);\">Nobody was asked to be kind. This is what happened anyway.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(238px, 1fr)); gap: clamp(16px, 3vw, 32px);\">\n          <sc-for list=\"{{ connCards }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.cardStyle }}\" style-hover=\"background: var(--color-neutral-200);\">\n              <div style=\"display: flex; align-items: flex-end; gap: 14px;\">\n                <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(58px, 11vw, 84px); line-height: 0.85; letter-spacing: -0.01em;\">{{ c.count }}<\u002Fdiv>\n                <div style=\"font-size: 15px; color: var(--color-neutral-700); padding-bottom: 6px;\">{{ c.pctLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height: 14px; background: var(--color-neutral-200); margin: 20px 0 16px;\">\n                <div style=\"{{ c.barStyle }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: 22px; margin-bottom: 8px;\">{{ c.label }}<\u002Fdiv>\n              <div style=\"font-size: 14px; line-height: 1.55; color: var(--color-neutral-800);\">{{ c.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top: 2px solid var(--color-divider); padding-top: 20px; margin-bottom: 72px;\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 28px;\">\n          <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(23px, 3.6vw, 28px);\">What the table talked about<\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--color-neutral-700);\">Solid bar: the main subject. Pale bar: raised alongside something else.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ lensBars }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ b.onClick }}\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px clamp(12px, 2vw, 24px); padding: 14px 0; border-bottom: 1px solid var(--color-neutral-300); cursor: pointer;\" style-hover=\"background: var(--color-neutral-200);\">\n              <div style=\"flex: 0 1 auto; min-width: 96px; font-family: var(--font-heading); font-weight: 600; font-size: clamp(19px, 3.4vw, 26px); letter-spacing: 0;\">{{ b.label }}<\u002Fdiv>\n              <div style=\"flex: 1 1 240px; display: flex; align-items: center; height: 28px; min-width: 200px;\">\n                <div style=\"{{ b.primaryStyle }}\"><\u002Fdiv>\n                <div style=\"{{ b.secondaryStyle }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex: 0 0 auto; font-size: 13px; color: var(--color-neutral-700); text-align: right; min-width: 46px;\">{{ b.countLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top: 2px solid var(--color-divider); padding-top: 20px; margin-bottom: 72px;\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 28px;\">\n          <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(23px, 3.6vw, 28px);\">How the evening moved<\u002Fdiv>\n          <div style=\"display: flex; gap: 20px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;\">\n            <span style=\"display: flex; align-items: center; gap: 7px;\"><span style=\"width: 12px; height: 12px; background: var(--color-accent); display: block;\"><\u002Fspan>Gap<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 7px;\"><span style=\"width: 12px; height: 12px; background: var(--color-neutral-500); display: block;\"><\u002Fspan>Tension<\u002Fspan>\n            <span style=\"display: flex; align-items: center; gap: 7px;\"><span style=\"width: 12px; height: 12px; background: var(--color-text); display: block;\"><\u002Fspan>Widening<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ arcRows }}\" as=\"a\" hint-placeholder-count=\"7\">\n            <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ a.onClick }}\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 14px 0; border-bottom: 1px solid var(--color-neutral-300); cursor: pointer;\" style-hover=\"background: var(--color-neutral-200);\">\n              <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: 26px; color: var(--color-accent); line-height: 1; flex: none; width: 26px;\">{{ a.sec }}<\u002Fdiv>\n              <div style=\"font-size: 16px; line-height: 1.3; flex: 3 1 200px; min-width: 0;\">{{ a.title }}<\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 2px; height: 28px; flex: 1 1 190px;\">\n                <sc-for list=\"{{ a.segs }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div title=\"{{ s.title }}\" style=\"{{ s.style }}\">{{ s.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top: 2px solid var(--color-divider); padding-top: 20px; margin-bottom: 24px;\">\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 28px;\">\n          <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: clamp(23px, 3.6vw, 28px);\">Who acts on whom<\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--color-neutral-700);\">Read across: what is doing something, to what. Darker means more moments. On a phone, swipe the grid sideways.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: clamp(28px, 4vw, 56px); align-items: start;\">\n          <div style=\"min-width: 0; overflow-x: auto;\">\n            <div style=\"display: grid; grid-template-columns: minmax(70px, 118px) repeat(4, minmax(50px, 1fr)); gap: 2px; min-width: 300px;\">\n              <div><\u002Fdiv>\n              <sc-for list=\"{{ matrixCols }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"font-size: 10px; line-height: 1.15; letter-spacing: 0.02em; text-transform: uppercase; color: var(--color-neutral-700); padding-bottom: 8px; overflow-wrap: anywhere;\">{{ c }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ matrixRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"display: contents;\">\n                  <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: 15px; display: flex; align-items: center; padding-right: 12px;\">{{ r.label }}<\u002Fdiv>\n                  <sc-for list=\"{{ r.cells }}\" as=\"cell\" hint-placeholder-count=\"4\">\n                    <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ cell.onClick }}\" title=\"{{ cell.title }}\" style=\"{{ cell.style }}\">{{ cell.text }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left: 2px solid var(--color-divider); padding-left: clamp(16px, 2.6vw, 32px);\">\n            <div style=\"font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700); margin-bottom: 14px;\">What this says<\u002Fdiv>\n            <p style=\"font-size: 15px; line-height: 1.6; color: var(--color-neutral-800);\">{{ matrixNote }}<\u002Fp>\n            <div style=\"border-top: 1px solid var(--color-neutral-300); margin-top: 16px; padding-top: 16px; font-size: 15px; line-height: 1.6; color: var(--color-neutral-800);\">{{ singleNote }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"transcript\" style=\"padding: 88px 0 0;\">\n      <hr class=\"hr\" style=\"margin: 0 0 40px;\">\n      <h6 style=\"color: var(--color-neutral-700); margin-bottom: 24px;\">In their words · London · 15 June<\u002Fh6>\n      <h2 style=\"font-size: clamp(30px, 5.4vw, 46px); letter-spacing: -0.005em; text-wrap: pretty; max-width: 22ch; margin-bottom: 16px;\">Every moment, unedited.<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.6; max-width: 60ch; color: var(--color-neutral-800); margin-bottom: 32px;\">People are named the way they described themselves that evening. Any names spoken in the room are removed.<\u002Fp>\n\n      <div style=\"{{ barStyleOuter }}\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px;\">\n          <div style=\"font-size: 13px; color: var(--color-neutral-700);\">{{ resultLabel }}<\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ toggleFilters }}\" style=\"{{ toggleStyle }}\">{{ toggleLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"{{ groupsStyle }}\">\n        <sc-for list=\"{{ filterGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px;\">\n            <div style=\"flex: 0 0 auto; min-width: 108px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-700);\">{{ g.label }}<\u002Fdiv>\n            <div style=\"flex: 1 1 240px; display: flex; flex-wrap: wrap; gap: 6px;\">\n              <sc-for list=\"{{ g.chips }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <button type=\"button\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"{{ resetStyle }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ resetFilters }}\" class=\"btn btn-secondary\" style=\"font-size: 13px; min-height: 40px; white-space: nowrap; flex: none;\">Reset filters<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 24px; padding: 12px 0; border-bottom: 1px solid var(--color-neutral-300); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-600);\">\n        <div style=\"flex: 3 1 300px; display: flex; gap: 12px;\"><span style=\"width: 42px;\">No.<\u002Fspan><span>What was said<\u002Fspan><\u002Fdiv>\n        <div style=\"flex: 2 1 260px;\">How we read it<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column;\">\n        <sc-for list=\"{{ rows }}\" as=\"u\" hint-placeholder-count=\"12\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 14px 24px; padding: 18px 0; border-bottom: 1px solid var(--color-neutral-300); align-items: flex-start;\" style-hover=\"background: var(--color-neutral-200);\">\n            <div style=\"flex: 3 1 300px; display: flex; gap: 12px; align-items: flex-start;\">\n              <div style=\"width: 42px; flex: none;\">\n                <div style=\"font-family: var(--font-heading); font-weight: 600; font-size: 14px; color: var(--color-accent);\">{{ u.id }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"min-width: 0;\">\n                <div style=\"font-size: 16px; line-height: 1.5; margin-bottom: 6px;\">{{ u.q }}<\u002Fdiv>\n                <div style=\"font-size: 12px; line-height: 1.4; color: var(--color-neutral-700);\">{{ u.who }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 2 1 260px; min-width: 0; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-start;\">\n              <div style=\"flex: 1 1 108px; min-width: 0;\">\n                <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 3px;\">About<\u002Fdiv>\n                <div style=\"font-size: 13px; line-height: 1.4;\">{{ u.lensLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex: 0 0 100px;\">\n                <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 3px;\">Empathy<\u002Fdiv>\n                <span style=\"{{ u.connStyle }}\">{{ u.conn }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex: 1 1 108px; min-width: 0;\">\n                <div style=\"font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 3px;\">Underneath<\u002Fdiv>\n                <div style=\"font-size: 12px; line-height: 1.4; color: var(--color-neutral-700);\">{{ u.silentLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"{{ emptyStyle }}\">No moment matches all three filters at once. <button type=\"button\" sc-camel-on-click=\"{{ resetFilters }}\" style=\"font-family: inherit; font-size: 16px; color: var(--color-accent); background: none; border: 0; border-bottom: 1px solid var(--color-accent); padding: 0; cursor: pointer;\">Clear them<\u002Fbutton><\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: clamp(52px, 8vw, 88px) 0 0;\">\n      <hr class=\"hr\" style=\"margin: 0 0 48px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(28px, 5vw, 64px);\">\n        <div>\n          <h6 style=\"color: var(--color-neutral-700); margin-bottom: 24px;\">Conclusion<\u002Fh6>\n          <h2 style=\"font-size: clamp(28px, 4.8vw, 40px); letter-spacing: -0.005em; line-height: 1.08; text-wrap: pretty; margin-bottom: 28px;\">Not a city in distress. A city that has learned to cope privately with structural issues.<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; justify-content: center; gap: 18px;\">\n          <p style=\"font-size: clamp(16px, 1.9vw, 17px); line-height: 1.6;\">The Gaps cluster where institutions meet the body: the care worker who absorbs the system and has no room to process their own life, the sensory city that fails the person who most wants to connect.<\u002Fp>\n          <p style=\"font-size: clamp(16px, 1.9vw, 17px); line-height: 1.6;\">The Widenings are almost all person-to-person, built by individuals doing the work themselves. Between those two sits a room that disagreed openly about responsibility and did not settle it. That unresolved tension is part of the finding, not a flaw in the reading.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding: clamp(44px, 7vw, 72px) 0 clamp(56px, 9vw, 96px);\">\n      <div style=\"border-top: 2px solid var(--color-divider); padding-top: 28px; margin-bottom: 40px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 14px 32px;\">\n        <h2 style=\"font-size: clamp(28px, 4.8vw, 40px); letter-spacing: -0.005em; margin: 0;\">What happens next<\u002Fh2>\n        <div style=\"font-size: 15px; color: var(--color-neutral-700); max-width: 46ch;\">Listening is only the first half. Each of the three patterns points somewhere different.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(252px, 1fr)); gap: clamp(24px, 3vw, 32px);\">\n        <sc-for list=\"{{ nextSteps }}\" as=\"n\" hint-placeholder-count=\"3\">\n          <div style=\"{{ n.cardStyle }}\">\n            <div style=\"{{ n.tagStyle }}\">{{ n.tag }}<\u002Fdiv>\n            <p style=\"font-size: 16px; line-height: 1.6; margin: 20px 0 0;\">{{ n.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <footer style=\"border-top: 2px solid var(--color-divider); padding: clamp(28px, 5vw, 40px) clamp(20px, 5vw, 40px); display: flex; align-items: baseline; justify-content: space-between; gap: 18px 24px; flex-wrap: wrap;\">\n    <div style=\"display: flex; align-items: center; gap: 16px;\">\n      <img src=\"a7f835ad-7f81-4705-b8e8-94235ace532c\" alt=\"\" style=\"width: 52px; height: 52px; display: block; flex: none;\">\n      <span style=\"font-family: var(--font-heading); font-weight: 600; font-size: 17px;\">Humans in Conversation. Where cities pause to listen.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 13px; color: var(--color-neutral-700);\">\n      <a href=\"https://open.spotify.com/show/2ILbCJPVYC5YXUJunZSBy6\" target=\"_blank\" rel=\"noopener\">The archive on Spotify<\u002Fa>\n      <a href=\"https://humansinconversation.com\" target=\"_blank\" rel=\"noopener\">humansinconversation.com<\u002Fa>\n      <span>© 2026 HuCon<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440}}\">\nclass Component extends DCLogic {\n  state = { section: 'All', lens: 'All', conn: 'All', wide: true, filtersOpen: true };\n\n  SPK = { ND: 'Neurodivergent Londoner', NL: 'Native Londoner', LL: 'Longtime Londoner', NG: 'Nigerian Londoner', MH: 'Mental health worker', MID: 'Person from the Midlands', MAN: 'Manchester Person', PH: 'Public health worker', LA: 'Late arrival' };\n  CONN = { G: 'Gap', T: 'Tension', W: 'Widening' };\n  SECTIONS = [\n    ['A', 'Arriving and the body check-in', 'Arriving'],\n    ['B', 'Shared space and coping', 'Shared space'],\n    ['C', 'Migration, race, and the London/UK split', 'Migration & race'],\n    ['D', 'Pride, Human Rights', 'Pride'],\n    ['E', 'The food', 'The food'],\n    ['F', 'Identity, survival, and who gets left behind', 'Identity & survival'],\n    ['G', 'Acceptance, responsibility, and inclusion', 'Responsibility']\n  ];\n\n  componentDidMount() {\n    const mq = window.matchMedia('(min-width: 820px) and (min-height: 700px)');\n    this._mq = mq;\n    this._onMq = e => this.setState({ wide: e.matches, filtersOpen: e.matches });\n    mq.addEventListener('change', this._onMq);\n    this.setState({ wide: mq.matches, filtersOpen: mq.matches });\n  }\n\n  componentWillUnmount() { if (this._mq) this._mq.removeEventListener('change', this._onMq); }\n\n  DATA = [\n    ['A',1,'ND','“when it’s hot like this, the energy that it takes to mask is almost impossible. So I will be unmasked today.”','Science/Society','Science>Society','W','culture'],\n    ['A',2,'ND','“London sometimes isn’t that safe because it’s a constant bombardment of noise… Especially gay spaces, where I probably most want to connect.”','State/Society','State>Society','G',''],\n    ['A',3,'ND','“if we mask, we feel like an imposter… ‘I’m broken, I’m wrong, why am I not like everyone else?’ And then I’m in the closet and it’s painful.”','Society/Storytellers','','G','culture'],\n    ['A',4,'ND','“The opposite of imposter? For me, it’s to inhabit. To truly inhabit myself and to be compassionate to myself.”','Storytellers','','W',''],\n    ['A',5,'ND','“my awareness only really began with my own diagnosis, and before that… I would have never understood what I understand now.”','Science/Society','Science>Society','W',''],\n    ['A',6,'NL','“I understood so much of why I was experiencing burnout in London because of undiagnosed neurodivergence.”','Science/Society','Science>Society','W',''],\n    ['A',7,'NL','“I accidentally medicated my ADHD through where I was physically placed… London feeds all of my ADHD.”','Storytellers/Science','','W','class'],\n    ['A',8,'NL','“I kind of think of London a bit like a toxic ex-partner… London’s a place that really dictates to you how you experience it.”','Storytellers','Society>Society','T',''],\n    ['A',9,'NL','“so many different diverse communities exist in London and are in commune with each other in a way that I don’t see in other cities.”','Society','','W',''],\n    ['A',10,'NL','“wealth next to poverty… living really on top of each other in a way that the city forces you to interact… a sweltering central line tube carriage together.”','State/Society','State>Society','W','class'],\n    ['A',11,'NL','“so many queer venues closing… the gentrification… the wealth that comes in… And now we’ve got 20 Costas and no soul.”','State/Society','State>Society','G','money, corporate interests'],\n    ['B',1,'LL','“There’s a disconnect in how we use shared space… people move like the space is theirs and not really coming from a place of interconnection.”','Society','Society>Society','G','culture'],\n    ['B',2,'LL','“he just reached out behind me and flicked his hand, and my popcorn went flying. And he’s like, you’re not my father.”','Society/Storytellers','Society>Society','G','tech'],\n    ['B',3,'LL','“London right now feels like a place of disconnection. On the surface it looks beautiful… I just feel such heartbreak.”','Society/Storytellers','','G',''],\n    ['B',4,'NG','“somewhere where there’s no train station close by… almost like segregation days in America… And I find peace there.”','State/Society','State>Society','T','class, history'],\n    ['B',5,'NG','“I learn to zone out… my own mental health issues are almost ignored, and I completely zone out just for my own peace.”','Society/Science','','G',''],\n    ['B',6,'NG','“I know you said London forces you, it dictates to you. I beg to differ… you can actually choose your space here.”','Society','Society>Society','T',''],\n    ['C',1,'MH','“as a migrant, London is beautiful. It reminds me of Lagos… it can be lonely… It’s all about just work, work, work.”','Society/State','','G','money'],\n    ['C',2,'MID','“Because of the political climate… things have really become very uncomfortable for people who look like me.”','State/Society','State>Society','G','politics, race, migration'],\n    ['C',3,'MID','“you’re pretty much walking around, and you have an eye behind you, because you’re not quite sure what’s going to happen next.”','State/Society','State>Society','G','politics, race'],\n    ['C',4,'MID','“I come to London to get a good dose of what normalcy should look like… cities outside of London… have gone back… 30, 40, 50 years.”','Society','Society>Society','T','politics'],\n    ['C',5,'MID','“I’ve done very well for myself. I’ve got no problems, but still, I feel very uncomfortable… very lonely in your own home.”','Society','','G','race, class'],\n    ['C',6,'MAN','“I don’t really go out. I’m an indoor person… I get everything that I want in my space.”','Society','','T',''],\n    ['C',7,'MAN','“The nature of my job means nobody would want to be racially abusive to me, because they need my help.”','Society/State','Society>Society','T','race, class'],\n    ['C',8,'MAN','“My children often see a different version of me depending on the person in front of me.”','Society/Storytellers','','T',''],\n    ['C',9,'PH','“I would say the word ‘fine’… I’m completely dissociated from myself, and I’m very performative.”','Society/Science','','G',''],\n    ['C',10,'PH','“I still feel my voice is drowned… I don’t even know where I identify as a person.”','Society','','G',''],\n    ['C',11,'PH','“I go into people’s houses every day… I’m exposed to baggage every day… I’ve never been given a chance ever in my life to process mine.”','State/Society','State>Society','G','money'],\n    ['D',1,'ND','“My first Pride march at age 16… exhilarating… I can still hear the boos… the saliva on my face… how the police were with us.”','State/Society','State>Society','T','politics, history'],\n    ['D',2,'ND','“We understood how the wheels of oppression turned for us, so we understood how they turned for others… anti-apartheid… the miners’ strike… it was being part of something.”','Society','Society>Society','W','politics, class, age'],\n    ['D',3,'ND','“in some ways the project worked. People do feel safe… But what’s lost is giving a damn about other people.”','Society','Society>Society','T','politics'],\n    ['D',4,'ND','“being around difference means that my own difference can settle… When I’m around sameness, something doesn’t sit in my soul.”','Society','','W',''],\n    ['D',5,'ND','“Step inside one of those gay pubs, you don’t see many Black faces… there must be a force that keeps that out. And I’m really interested in that force.”','Society/Storytellers','Society>Society','G','race'],\n    ['D',6,'ND','“at 60, online, I get either hey, daddy, or, fuck off, granddad… I’ll go with my noise-cancelling headphones and not speak to anyone and go home sad.”','Society','Society>Society','G','age, tech'],\n    ['D',7,'NL','“The counterculture just moves… a warehouse in Tottenham until 4am, surrounded by a huge diversity of age, of gender identity, of queerness, of ethnicity.”','Society','','W',''],\n    ['D',8,'NL','“London offers a chance to just constantly reinvent… I came as a person who identified as a straight man. And that is not how I identify anymore.”','Society/Storytellers','','W',''],\n    ['D',9,'NL','“I don’t want to move back to the UK… I want to move back to London… to be part of the fight against what’s happening now.”','Society/State','Society>State','W','politics'],\n    ['D',10,'NL','“the millennials, we were so complacent and so naive… assuming that progress was just natural… I think my generation dropped the ball.”','Society','Society>Society','T','age, politics, history'],\n    ['E',1,'MID','“I have got crackers… because of my mum… it goes as far as the colonial era… sailors used to trade crackers and other goods for various items, guns and all that.”','Storytellers','','W','history'],\n    ['E',2,'PH','“I brought chin-chin and meat pie… it’s like our crackers, but a different version. Different cultures within Africa call it different things, but there’s a common thread.”','Storytellers/Society','','W','migration'],\n    ['E',3,'LL','“I brought strawberries… it’s very British… And then I also brought some pastries… ‘café? When did you start going to cafés?’”','Storytellers','','W','class'],\n    ['E',4,'NL','“I brought Greggs… without the level of diversity and multiculturalism… we would just be eating pork pies and sausage rolls… my autism means that I really like the simple things.”','Storytellers/Society','Society>Society','W','history'],\n    ['F',1,'NG','“kito… how gay people are treated in Nigeria… You meet somebody on Grindr, they get to you straight away, they call the police, they harass you.”','State/Society','State>Society','G','politics, religion, money'],\n    ['F',2,'NG','“I’m almost beginning to not feel the pain anymore, because it’s been normalized to me… I’m just going to watch The Devil Wears Prada instead.”','State/Society','State>Society','G','tech'],\n    ['F',3,'NG','“pundits on TV referring to all the French players as immigrants… the things that used to unite us… The division has come even into sports.”','Storytellers/Society','Storytellers>Society','G','race'],\n    ['F',4,'LL','“nostalgia starts off with nostos, which is the longing for home… Being a gay man in a home where I felt rejected… I just wanted to find that space where people know my name.”','Society','Society>Society','G',''],\n    ['F',5,'LL','“I would love to hear from someone here… as a straight woman, what’s your experience? How do you feel living in London?”','Society','Society>Society','W',''],\n    ['F',6,'MH','“people who are running away from different places and coming to find home here because of their sexuality… a lot of them are really traumatized… It’s about finding home.”','State/Society','State>Society','G','migration, religion, politics'],\n    ['F',7,'MID','“I’ve consciously decided to love them… because I realized that I knew what it’s like to feel different.”','Society','Society>Society','W',''],\n    ['F',8,'MID','“we’re all sort of struggling to survive because of the cost of living… resources have been taken on both sides. One side intentionally by a budget, the other side by the economy.”','State/Storytellers','State>Society','G','money, politics'],\n    ['F',9,'ND','“there is so much globally… the human nervous system was never designed to have… We shouldn’t have this much information… like a pressure cooker.”','Science/Storytellers','Science>Society','G','tech'],\n    ['F',10,'ND','“can we just have a deal? If I just give you 20 quid on a Monday, then don’t ask me for money. We can keep our dignity for that.”','Society','Society>Society','W','money, migration, class'],\n    ['G',1,'MAN','“knowledge is power… a particular proverb… You have a different view about sexuality. We don’t all have to be equal… you’re my blood, anywhere, anytime.”','Storytellers','Society>Society','W','culture, religion'],\n    ['G',2,'MAN','“Insanity is doing the same thing the same way and expecting a different result… You need to do something different to get what you’re looking for.”','Society/Storytellers','Society>Society','T',''],\n    ['G',3,'MAN','“does the government have to do more for people? I don’t think so. People have to take responsibility. The individual is the architect of his own fortune.”','State/Society','State>Society','T','politics, money'],\n    ['G',4,'MID','“as gay people, everything about us has to evolve… that’s part of evolution, not continuing.”','Society/Storytellers','Society>Society','T',''],\n    ['G',5,'MID','“we are living in a pressurized system… at breaking point… The resources we have are not enough… government has to do the balancing act, and that is part of evolving.”','State/Society','State>Society','T','money, politics, migration'],\n    ['G',6,'NL','“trans women, Black trans women… started the fight for rights… never given a proper seat at the table… Capitalism recognized… expendable income.”','Society/State','Society>Society','G','money, corporate interests, race'],\n    ['G',7,'NL','“a corporate street party sponsored by Barclays. The prides I want to be at are the ones happening outside of London… born out of a need for a fight.”','Storytellers/Society','Storytellers>Society','T','corporate interests, money'],\n    ['G',8,'NL','“shit rolls downhill… it always lands on the same people in our community… the money was never actually going into any kind of community building, it was just a token.”','Society','Society>Society','W','money, corporate interests, politics'],\n    ['G',9,'LA','“there are more good people out there, and we just need to reach them… rather than being passive or docile, waiting for the noisier bunch to take over.”','Society','Society>Society','W','politics']\n  ];\n\n  units() {\n    return this.DATA.map(d => {\n      const lens = d[4].split('/');\n      return {\n        key: d[0] + d[1], sec: d[0], n: d[1], who: this.SPK[d[2]], q: d[3],\n        lens, primary: lens[0], secondary: lens[1] || null,\n        dyad: d[5], conn: this.CONN[d[6]], connKey: d[6],\n        silent: d[7] ? d[7].split(', ') : []\n      };\n    });\n  }\n\n  connColor(c) {\n    return c === 'Gap' ? 'var(--color-accent)' : c === 'Tension' ? 'var(--color-neutral-500)' : 'var(--color-text)';\n  }\n\n  set(k, v) {\n    this.setState(s => ({ [k]: s[k] === v ? 'All' : v }));\n    const el = document.getElementById('transcript');\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 60, behavior: 'smooth' });\n  }\n\n  renderVals() {\n    const units = this.units();\n    const st = this.state;\n    const total = units.length;\n\n    const framework = [\n      { name: 'State', def: 'The institutions that run your day: the NHS, the tube, the rules, the budget.' },\n      { name: 'Science', def: 'Bodies, diagnoses, research, and how much of it we trust.' },\n      { name: 'Storytellers', def: 'Media, brands, language. The stories we inherit about ourselves and each other.' },\n      { name: 'Society', def: 'Each other. Friends, neighbours, strangers, communities.' }\n    ];\n\n    const connDesc = {\n      Gap: 'Empathy missing. These land where institutions meet the body.',\n      Tension: 'Two truths at once. The room disagreed and never settled it.',\n      Widening: 'Empathy opening up. Almost always one person to another.'\n    };\n    const connCards = ['Gap', 'Tension', 'Widening'].map(c => {\n      const count = units.filter(u => u.conn === c).length;\n      const pct = Math.round(count / total * 100);\n      const active = st.conn === c;\n      return {\n        label: c, count, pctLabel: pct + '% of moments', desc: connDesc[c],\n        onClick: () => this.set('conn', c),\n        cardStyle: { cursor: 'pointer', padding: 'clamp(16px, 2.6vw, 24px)', border: active ? '2px solid var(--color-text)' : '2px solid transparent', background: active ? 'var(--color-neutral-200)' : 'transparent', transition: 'background 120ms' },\n        barStyle: { width: pct + '%', height: '100%', background: this.connColor(c) }\n      };\n    });\n\n    const lensMeta = [['S1', 'State'], ['S2', 'Science'], ['S3', 'Storytellers'], ['S4', 'Society']];\n    const maxLens = Math.max.apply(null, lensMeta.map(m => units.filter(u => u.lens.indexOf(m[1]) > -1).length));\n    const lensBars = lensMeta.map(m => {\n      const p = units.filter(u => u.primary === m[1]).length;\n      const s = units.filter(u => u.secondary === m[1]).length;\n      return {\n        code: m[0], label: m[1], countLabel: p + ' + ' + s,\n        onClick: () => this.set('lens', m[1]),\n        primaryStyle: { width: (p / maxLens * 100) + '%', height: st.lens === m[1] ? '28px' : '22px', background: 'var(--color-text)', transition: 'height 120ms' },\n        secondaryStyle: { width: (s / maxLens * 100) + '%', height: st.lens === m[1] ? '28px' : '22px', background: 'var(--color-neutral-400)', transition: 'height 120ms' }\n      };\n    });\n\n    const arcRows = this.SECTIONS.map(sec => {\n      const inSec = units.filter(u => u.sec === sec[0]);\n      const segs = ['Gap', 'Tension', 'Widening'].map(c => {\n        const n = inSec.filter(u => u.conn === c).length;\n        return {\n          label: n ? String(n) : '',\n          title: n + ' ' + c,\n          style: { width: (n / 11 * 100) + '%', height: '100%', background: this.connColor(c), color: 'var(--color-bg)', fontSize: '12px', fontFamily: 'var(--font-body)', fontWeight: 500, display: 'flex', alignItems: 'center', justifyContent: 'center' }\n        };\n      });\n      return { sec: sec[0], title: sec[1], segs, onClick: () => this.set('section', sec[0]) };\n    });\n\n    const actors = ['State', 'Science', 'Storytellers', 'Society'];\n    const dyadUnits = units.filter(u => u.dyad);\n    const maxCell = Math.max.apply(null, actors.map(a => Math.max.apply(null, actors.map(b => dyadUnits.filter(u => u.dyad === a + '>' + b).length))));\n    const matrixRows = actors.map(a => ({\n      label: a,\n      cells: actors.map(b => {\n        const n = dyadUnits.filter(u => u.dyad === a + '>' + b).length;\n        const k = n / maxCell;\n        return {\n          text: n ? String(n) : '·',\n          title: n + ' moments: ' + a + ' acting on ' + b,\n          onClick: () => this.set('lens', n ? a : 'All'),\n          style: { aspectRatio: '2.6', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--font-body)', fontWeight: 500, fontSize: n ? 'clamp(15px, 2.4vw, 20px)' : '14px', minHeight: '44px', cursor: n ? 'pointer' : 'default', background: n ? 'color-mix(in srgb, var(--color-text) ' + Math.round(12 + k * 88) + '%, var(--color-bg))' : 'var(--color-neutral-200)', color: n && k > 0.4 ? 'var(--color-bg)' : 'var(--color-neutral-700)' }\n        };\n      })\n    }));\n    const s2s = dyadUnits.filter(u => u.dyad === 'Society>Society').length;\n    const st2s = dyadUnits.filter(u => u.dyad === 'State>Society').length;\n\n    const match = (u, s) =>\n      (s.section === 'All' || u.sec === s.section) &&\n      (s.lens === 'All' || u.lens.indexOf(s.lens) > -1) &&\n      (s.conn === 'All' || u.conn === s.conn);\n\n    const chips = (label, key, values) => ({\n      label,\n      chips: [{ v: 'All', l: 'All' }].concat(values).map(o => {\n        const v = o.v || o, l = o.l || o;\n        const active = st[key] === v;\n        const trial = Object.assign({}, st); trial[key] = v;\n        const n = units.filter(u => match(u, trial)).length;\n        return {\n          label: n ? l : l + ' (0)',\n          onClick: () => this.setState({ [key]: v }),\n          style: { fontFamily: 'var(--font-body)', fontWeight: 500, fontSize: '13px', padding: '9px 12px', minHeight: '36px', lineHeight: '1.1', border: '1px solid ' + (active ? 'var(--color-text)' : 'var(--color-neutral-300)'), background: active ? 'var(--color-text)' : 'transparent', color: active ? 'var(--color-bg)' : 'var(--color-text)', cursor: 'pointer', borderRadius: 0, opacity: n ? 1 : 0.4 }\n        };\n      })\n    });\n\n    const filterGroups = [\n      chips('Part of the evening', 'section', this.SECTIONS.map(s => ({ v: s[0], l: st.wide ? s[1] : s[2] }))),\n      chips('About', 'lens', ['State', 'Science', 'Storytellers', 'Society']),\n      chips('Empathy', 'conn', ['Gap', 'Tension', 'Widening'])\n    ];\n\n    const activeCount = ['section', 'lens', 'conn'].filter(k => st[k] !== 'All').length;\n    const filtered = units.filter(u => match(u, st));\n\n    const rows = filtered.map(u => ({\n      id: u.key, who: u.who, q: u.q,\n      lensLabel: u.lens.join(' / '),\n      dyadLabel: u.dyad ? u.dyad.replace('>', ' → ') : '—',\n      conn: u.conn,\n      silentLabel: u.silent.length ? u.silent.join(', ') : '—',\n      connStyle: { display: 'inline-block', fontFamily: 'var(--font-body)', fontWeight: 500, fontSize: '11px', letterSpacing: '0.08em', textTransform: 'uppercase', padding: '4px 8px', background: this.connColor(u.conn), color: 'var(--color-bg)' }\n    }));\n\n    const nextSteps = [\n      { tag: 'Widening', body: 'The twenty-pound weekly agreement with a homeless neighbor, made to protect the dignity of both, is a compassionate practice that a city already has. Find these, name them, amplify them.' },\n      { tag: 'Tension', body: 'The table was split on whether the answer is individual responsibility or public provision, and both positions were held by people living with the consequences. Convene another table there.' },\n      { tag: 'Gap', body: 'Public health workers enter the city’s hardest homes daily and are given no room to process what they carry. Bring the actors who are implicated but rarely in the same room: commissioners, clinicians, community leaders, residents.' }\n    ].map(n => ({\n      tag: n.tag, body: n.body,\n      cardStyle: { borderTop: '2px solid ' + this.connColor(n.tag), paddingTop: '20px' },\n      tagStyle: { fontFamily: 'var(--font-heading)', fontWeight: 600, fontSize: '34px', letterSpacing: '0', color: n.tag === 'Tension' ? 'var(--color-neutral-700)' : this.connColor(n.tag) }\n    }));\n\n    return {\n      framework, connCards, lensBars, arcRows, rows, nextSteps, filterGroups,\n      matrixCols: actors,\n      matrixRows,\n      matrixNote: 'People acting on people is the biggest square, with ' + s2s + ' moments. Londoners talked about each other far more than about the systems around them.',\n      singleNote: 'Institutions acting on people accounts for ' + st2s + ' moments, and that is where almost all the missing empathy sits. Another ' + (units.length - dyadUnits.length) + ' moments involve nothing acting on anything, just someone describing their life.',\n      resultLabel: 'Showing ' + rows.length + ' of ' + total + ' moments',\n      filtersOpen: st.filtersOpen,\n      activeCount: activeCount,\n      toggleLabel: st.filtersOpen ? 'Hide filters' : (activeCount ? 'Filters (' + activeCount + ')' : 'Filters'),\n      toggleFilters: () => this.setState(s => ({ filtersOpen: !s.filtersOpen })),\n      toggleStyle: { display: st.wide ? 'none' : 'inline-flex', alignItems: 'center', fontFamily: 'var(--font-body)', fontWeight: 500, fontSize: '13px', padding: '9px 14px', minHeight: '40px', border: '1px solid var(--color-accent)', background: st.filtersOpen ? 'transparent' : 'var(--color-accent)', color: st.filtersOpen ? 'var(--color-accent)' : 'var(--color-bg)', cursor: 'pointer', borderRadius: 0, flex: 'none' },\n      groupsStyle: { display: st.filtersOpen ? 'flex' : 'none', flexDirection: 'column', gap: '10px' },\n      resetStyle: { display: st.filtersOpen ? 'inline-flex' : 'none' },\n      barStyleOuter: { position: 'sticky', top: 0, zIndex: 10, background: 'var(--color-bg)', borderTop: '2px solid var(--color-divider)', borderBottom: '2px solid var(--color-divider)', padding: '12px 0', display: 'flex', flexDirection: 'column', gap: '10px', maxHeight: '40vh', overflowY: 'auto' },\n      resetFilters: () => this.setState({ section: 'All', lens: 'All', conn: 'All' }),\n      emptyStyle: { display: rows.length ? 'none' : 'block', padding: '48px 0', fontSize: '16px', color: 'var(--color-neutral-700)' }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
